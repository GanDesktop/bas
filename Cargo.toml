[workspace]
members = ["bin/*", "crates/*"]
default-members = ["bin/bas", "bin/bast"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/GanDesktop/bas"
publish = false

[workspace.dependencies]
bas-protocol = { path = "crates/protocol" }
bas-client = { path = "crates/client" }
bas-server = { path = "crates/server" }
bas-config = { path = "crates/config" }
agent-client-protocol = "=3.3.0"
