name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show active-toolchain
      - name: Use a physical temporary directory on macOS
        if: runner.os == 'macOS'
        run: echo 'TMPDIR=/private/tmp' >> "$GITHUB_ENV"
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check independent packages
        run: |
          cargo check -p bas-protocol --no-default-features --locked
          cargo check -p bas-client --locked
          cargo check -p bas-server --locked
          cargo check -p bas-config --locked
          cargo check -p bas --locked
          cargo check -p bast --locked
          cargo check -p acp-test-agent --locked
      - name: Build binaries for E2E tests
        run: cargo build --workspace --bins --locked
      - name: Test
        run: cargo test --workspace --all-targets --locked -- --nocapture
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-${{ matrix.os }}
          path: target/e2e/
