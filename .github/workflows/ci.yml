name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Test Nix source snapshots and locked URI round trips
        run: python3 tests/nix_source.py
      - name: Test installer boundaries without modifying profiles
        run: |
          python3 tests/install_bas.py -v
      - name: Check formatting
        run: nix develop -c cargo fmt --all -- --check
      - name: Test standalone protocol, client and server
        run: |
          nix develop -c cargo test -p bas-protocol --no-default-features --locked
          nix develop -c cargo test -p bas-client --locked
          nix develop -c cargo test -p bas-server --locked
      - name: Build all application targets
        run: nix develop -c cargo build --workspace --all-targets --locked
      - name: Test daemon and protocol
        run: nix develop -c cargo test --workspace --all-targets --locked
      - name: Lint default targets
        run: nix develop -c cargo clippy --workspace --all-targets --locked -- -D warnings
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        shell: bash
        run: rustup show active-toolchain
      - name: Use a physical temporary directory on macOS
        if: runner.os == 'macOS'
        run: echo 'TMPDIR=/private/tmp' >> "$GITHUB_ENV"
      - name: Test standalone protocol, client and server
        run: |
          cargo test -p bas-protocol --no-default-features --locked
          cargo test -p bas-client --locked
          cargo test -p bas-server --locked
      - name: Build native server and terminal
        run: cargo build --workspace --all-targets --locked
      - name: Test shared model and configuration
        run: cargo test --workspace --lib --locked
      - name: Test cancellable CLI terminal input
        if: runner.os == 'Windows'
        run: 'cargo test --bin bast command::agents::terminal --locked'
      - name: Test local IPC and explicit TCP
        run: 'cargo test --test daemon transport:: --locked'
      - name: Test native installation process ownership
        run: 'cargo test --bin bas management::runtime::process:: --locked'
      - name: Test native installation cancellation and shutdown
        run: 'cargo test --bin bas management::tests::lifecycle:: --locked'
