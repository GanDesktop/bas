[package]
name = "bas-mobile"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bas-browser-bridge = { path = "../../crates/browser-bridge" }
bas-client.workspace = true
nsh-core = { git = "https://github.com/longbridge/nsh", rev = "f81b965f69096f871ca21907f6fab6be32fd2d40" }
nsh-base = { git = "https://github.com/longbridge/nsh", rev = "f81b965f69096f871ca21907f6fab6be32fd2d40", default-features = false, features = ["editor", "highlight", "term"] }
gds-uim = { git = "https://github.com/GanDesktop/gds-uim", rev = "90f5424edf6ba9c5ffaacc2b11cb5ffe24960519" }
fluent-bundle = "0.16"
unic-langid = "0.9"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tonic = { version = "0.14", default-features = false }
tokio-stream = "0.1"
tokio = { version = "1", features = ["time"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[dev-dependencies]
nsh-engine = { git = "https://github.com/longbridge/nsh", rev = "f81b965f69096f871ca21907f6fab6be32fd2d40", default-features = false }
nsh-testing = { git = "https://github.com/longbridge/nsh", rev = "f81b965f69096f871ca21907f6fab6be32fd2d40", default-features = false }
tempfile = "3"
