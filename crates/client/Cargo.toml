[package]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
name = "bas-client"
description = "Authenticated BAS RPC and ACP clients"

[features]
default = []
workspace-schema = ["bas-protocol/workspace-schema"]

[dependencies]
bas-protocol = { workspace = true, features = ["client"] }
agent-client-protocol = { workspace = true, features = ["unstable", "unstable_protocol_v2"] }
futures = "0.3"
prost = "0.14"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tonic = { version = "0.14", features = ["tls-ring", "gzip"] }
tracing = "0.1"
