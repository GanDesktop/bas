[package]
name = "bas-client"
version = "0.1.0"
edition = "2024"
description = "Authenticated BAS RPC and ACP clients"
repository = "https://github.com/GanDesktop/bas"
license = "MIT"
publish = false

[features]
default = []
workspace-schema = ["bas-protocol/workspace-schema"]

[dependencies]
bas-protocol = { path = "../protocol", features = ["client"] }
agent-client-protocol = { version = "=3.3.0", features = ["unstable", "unstable_protocol_v2"] }
futures = "0.3"
prost = "0.14"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tonic = { version = "0.14", features = ["tls-ring", "gzip"] }
tracing = "0.1"

[dev-dependencies]
tokio-stream = { version = "0.1", features = ["net"] }
