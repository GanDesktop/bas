[package]
name = "bas-protocol"
version = "0.1.0"
edition = "2024"
description = "Shared BAS models, wire protocol and authenticated transport primitives"
repository = "https://github.com/GanDesktop/bas"
license = "MIT"
publish = false

[features]
default = []
workspace-schema = ["dep:schemars", "dep:jsonschema"]
client = ["transport"]
server = ["transport"]
transport = ["dep:futures", "dep:hyper-util", "dep:rustls", "dep:tokio", "dep:tower", "dep:nix", "dep:windows-sys", "tonic/transport", "tonic/tls-ring", "tonic/gzip"]

[dependencies]
schemars = { version = "1.2", optional = true }
jsonschema = { version = "0.60", default-features = false, optional = true }
agent-client-protocol-schema = { version = "=1.11.0", default-features = false, features = ["unstable", "unstable_protocol_v2"] }
dirs = "6"
email_address = { version = "0.2", default-features = false }
regex = "1"
url = "2"
sha2 = "0.10"
prost = "0.14"
prost-types = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "0.28", features = ["derive"] }
thiserror = "2"
time = { version = "0.3", features = ["parsing", "macros"] }
uuid = { version = "1", features = ["serde", "v4", "v7"] }
tonic = { version = "0.14", default-features = false, features = ["codegen"] }
tonic-prost = "0.14"
futures = { version = "0.3", optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"], optional = true }
tower = { version = "0.5", features = ["util"], optional = true }

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["fs", "poll", "process", "signal", "term", "user"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Pipes", "Win32_System_SystemInformation", "Win32_System_Threading"], optional = true }
