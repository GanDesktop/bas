[package]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
name = "bas-server"
description = "BAS server transport adapters"

[features]
default = []

[dependencies]
bas-protocol = { workspace = true, features = ["server"] }
agent-client-protocol = { workspace = true, features = ["unstable", "unstable_protocol_v2"] }
futures = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1"
tonic = { version = "0.14", features = ["tls-ring", "gzip"] }
uuid = { version = "1", features = ["v4"] }
